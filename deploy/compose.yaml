name: restflow
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"
services:
  db:
    image: mariadb:11.4
    restart: unless-stopped
    command: ["--innodb-buffer-pool-size=128M", "--max-connections=40", "--performance-schema=OFF"]
    environment:
      MARIADB_ROOT_PASSWORD_FILE: /run/secrets/db_root_password
      MARIADB_DATABASE: restflow
      MARIADB_USER: restflow_app
      MARIADB_PASSWORD_FILE: /run/secrets/db_password
    secrets: [db_root_password, db_password, db_client]
    volumes: [database:/var/lib/mysql]
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    logging: *logging
  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    environment:
      PUBLIC_URL: ${RESTFLOW_PUBLIC_URL:-https://${RESTFLOW_DOMAIN:?Run configure.py first}}
      RESTFLOW_DB_HOST: db
      RESTFLOW_DB_PORT: "3306"
      RESTFLOW_DB_USER: restflow_app
      RESTFLOW_DB_PASSWORD_FILE: /run/secrets/db_password
      RESTFLOW_DB_DATABASE: restflow
      RESTFLOW_DB_DEMO_DATABASE: restflow_demo
      RESTFLOW_INITIAL_ADMIN_PASSWORD_FILE: /run/secrets/admin_password
    secrets: [db_password, admin_password]
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import json,urllib.request; d=json.load(urllib.request.urlopen('http://127.0.0.1:8000/api/health',timeout=3)); assert d['ok'] and not d['demo']"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    logging: *logging
  caddy:
    image: caddy:2
    restart: unless-stopped
    environment:
      RESTFLOW_DOMAIN: ${RESTFLOW_DOMAIN:?Run configure.py first}
      ACME_EMAIL: ${ACME_EMAIL:?Run configure.py first}
      NO_PROXY: app,db,localhost,127.0.0.1
    ports:
      - "${RESTFLOW_HTTP_PORT:-80}:80"
      - "${RESTFLOW_HTTPS_PORT:-443}:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - certificates:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy
    logging: *logging
secrets:
  db_root_password:
    file: ./.secrets/db_root_password
  db_password:
    file: ./.secrets/db_password
  admin_password:
    file: ./.secrets/admin_password
  db_client:
    file: ./.secrets/db_client.cnf
volumes:
  database:
  certificates:
  caddy_config:
