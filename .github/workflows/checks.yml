name: RestFlow checks
on:
  push:
    branches: [feature/restflow-prototype-20261105]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: test-only-password
        ports: ["3306:3306"]
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s --health-timeout=5s --health-retries=12
    env:
      RESTFLOW_DB_HOST: 127.0.0.1
      RESTFLOW_DB_PORT: "3306"
      RESTFLOW_DB_USER: root
      RESTFLOW_DB_PASSWORD: test-only-password
      RESTFLOW_DB_DATABASE: restflow_ci
      RESTFLOW_DB_DEMO_DATABASE: restflow_ci_demo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y libmariadb-dev
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: node --check web/app.js
      - run: for script in deploy/*.sh; do bash -n "$script"; done
      - run: g++ -std=c++11 -Wall -Wextra -pedantic tests/direction_test.cpp -o /tmp/restflow-direction && /tmp/restflow-direction
