<!doctype html>
<html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>RestFlow 현장 운영</title>
<style>
:root{font:16px system-ui,sans-serif;color:#152740;background:#f1f6f6;--teal:#007968;--line:#d5e4e3}*{box-sizing:border-box}body{margin:0}header{background:#172d49;color:white;padding:17px max(22px,calc((100vw - 1150px)/2));font-weight:850;font-size:25px}header span{color:#5de1ce}main{max-width:1190px;padding:24px;margin:auto}h1{font-size:36px;letter-spacing:-.05em;margin:10px 0}h2{margin:0 0 12px;font-size:21px}section,.card{background:white;border:1px solid var(--line);border-radius:16px;padding:19px;min-width:0}.grid{display:grid;grid-template-columns:1.2fr 1fr;gap:15px}label{display:block;margin:10px 0;font-weight:650}input,button,select{font:inherit}input:not([type=checkbox]):not([type=radio]),select{width:100%;display:block;padding:10px;border:1px solid #a8c2c2;border-radius:8px;margin-top:4px;color:inherit;background:white}button,a.button{border:0;background:var(--teal);color:white;font-weight:700;border-radius:9px;padding:10px 14px;cursor:pointer;text-decoration:none;display:inline-block}button:disabled{opacity:.55}button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid #008a77;outline-offset:2px}.secondary,a.secondary{color:#006858;background:#e6f4f1}.types{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:8px 0}.types label{margin:0}.types input{position:absolute;opacity:0}.types span{display:block;border:1px solid #adc7c5;border-radius:8px;padding:10px 4px;text-align:center;font-size:14px}.types input:checked+span{background:var(--teal);color:white}.types input:focus-visible+span{outline:3px solid #008a77;outline-offset:2px}.fields{display:grid;grid-template-columns:1fr 1fr;gap:8px}.map{height:435px;border-radius:11px;background:#e4efec;overflow:hidden}.search{display:flex;align-items:end;gap:6px;margin:0 0 10px}.search label{margin:0;flex:1}.row{display:flex;justify-content:space-between;align-items:center;gap:9px;border-top:1px solid var(--line);padding:9px 0;flex-wrap:wrap}.hint,#notice{color:#38615c}#notice{min-height:24px;margin:6px 0 12px}img{display:block;width:150px;height:150px;margin:10px 0}code{overflow-wrap:anywhere}.manager{max-width:560px;margin:auto}.manager .card{margin-bottom:14px}.step{display:flex;align-items:center;justify-content:space-between;gap:10px}.step input{max-width:110px;text-align:center}.full{width:100%;text-align:center;margin-top:5px}details{margin-top:12px}#search-results button{margin:3px;font-size:13px}fieldset{border:0;padding:0;margin:12px 0}legend{font-weight:750}@media(max-width:740px){main{padding:14px}.grid{grid-template-columns:1fr}.map{height:310px}h1{font-size:29px}}
.bar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.map-large{height:65vh;min-height:350px}.label-pin{display:flex;align-items:center;gap:6px;background:#fff;color:#152740;font:700 13px system-ui;padding:4px 7px 4px 4px;white-space:nowrap;border:1px solid #a3c4be;border-radius:12px;box-shadow:0 2px 6px #0002}.label-pin b{color:#fff;background:#007968;border-radius:9px;padding:5px 8px}.row-actions{display:flex;gap:8px;flex-wrap:wrap}button.danger{background:#faecea;color:#952f23}.map-tools{margin:12px 0}#add-place[hidden],#add-zone[hidden]{display:none}</style>
<!--TMAP_SDK-->
<header>Rest<span>Flow</span></header>
<main><h1 id="title"></h1><p id="notice" role="status"></p><div id="view"></div></main>
<script>
const script=document.createElement('script');
script.src=location.pathname.startsWith('/manage/')?'/legacy.js':location.pathname.startsWith('/module/')?'/ui.js':'/places.js';
document.body.append(script);
</script></html>
